server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    location = /ui {
        return 301 /ui/;
    }

    # The component registry that `oniko init` and `oniko add` read.
    location /ui/r/ {
        add_header Access-Control-Allow-Origin *;
        try_files $uri =404;
    }

    # dx puts a content hash in every asset name, so they never change.
    location /ui/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes all load the app shell.
    location /ui/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /ui/index.html;
    }
}
