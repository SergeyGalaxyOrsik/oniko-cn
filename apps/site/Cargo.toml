[package]
name = "oniko-site"
description = "The oniko-cn website at oniko.orsik.site/ui, built with oniko-cn."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["router"] }
oniko-registry.workspace = true
serde_json.workspace = true
oniko-cn = { path = "../../crates/oniko-cn" }
# The component pages show the gallery examples from apps/preview, which use these icons.
lucide-dioxus = { version = "3.63", features = ["all-icons"] }

[features]
default = ["web"]
web = ["dioxus/web"]

[lints]
workspace = true

[build-dependencies]
serde_json.workspace = true
